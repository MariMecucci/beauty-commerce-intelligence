
services:
  s3-local:
    image: chrislusf/seaweedfs:latest
    container_name: beauty-seaweedfs

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: beauty-commerce

    ports:
      - "127.0.0.1:8333:8333"

    volumes:
      - seaweed-data:/data

volumes:
  seaweed-data:

