
      - name: Build and validate metadata catalog
        run: |
          python scripts/08_build_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("reports/data_catalog.json").read_text(
                  encoding="utf-8"
              )
          )

          datasets = catalog["datasets"]

          assert len(datasets) == 6, "Expected 6 datasets"

          expected = {
              ("silver", "customers"),
              ("silver", "products"),
              ("silver", "orders"),
              ("silver", "order_items"),
              ("gold", "monthly_sales"),
              ("gold", "top_products"),
          }

          actual = {(d["layer"], d["name"]) for d in datasets}
          assert actual == expected, "Unexpected catalog datasets"

          for dataset in datasets:
              assert dataset["record_count"] > 0
              assert dataset["columns"]
              assert dataset["upstream"]

              columns = {c["name"] for c in dataset["columns"]}
              assert set(dataset["primary_key"]).issubset(columns)

          print("Metadata catalog validation PASSED")
          PY
